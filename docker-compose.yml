services:
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: nafaz-redis
    command: redis-server --port 6380
    restart: always
    ports:
      - "127.0.0.1:6380:6380"

  nafaz-scanner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: nafaz-scanner
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data:Z
    environment:
      - TZ=Asia/Jakarta
      - API_AUTH_TOKEN=${API_AUTH_TOKEN:-}
      - REDIS_ENABLED=true
      # Address by container name: podman-compose <1.3.0 namespaces this to the
      # service alias "redis", but podman 3.4.x rejects `--network=<net>:alias=`
      # and silently falls back to the default bridge, where only container
      # names resolve (via the dnsname plugin).
      - REDIS_ADDR=nafaz-redis:6380
      - GLOBAL_FUTURES_EXCHANGE=all
      - OKX_WS_ENABLED=${OKX_WS_ENABLED:-}
      - OKX_WS_URL=${OKX_WS_URL:-}
      - OKX_WS_STALE_AFTER=${OKX_WS_STALE_AFTER:-}
      - OKX_WS_RECONNECT_INTERVAL=${OKX_WS_RECONNECT_INTERVAL:-}
      - OKX_WS_MAX_RECONNECT_BACKOFF=${OKX_WS_MAX_RECONNECT_BACKOFF:-}
      # Server-only service_role key; shared with the executor, never put in tracked files.
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - SUPABASE_SCANNER_OUTBOX_PATH=${SUPABASE_SCANNER_OUTBOX_PATH:-/app/data/scanner/supabase-outbox.jsonl}
      # Optional override for Telegram config:
      # - TELEGRAM_ENABLED=true
      # - TELEGRAM_BOT_TOKEN=your_bot_token
      # - TELEGRAM_CHAT_ID=your_chat_id
    depends_on:
      - redis

  nafaz-executor:
    build:
      context: .
      dockerfile: Dockerfile.executor
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: nafaz-executor
    restart: always
    volumes:
      - ./config.json:/app/config.json:ro
      - ./executor:/app/executor:ro
      - ./data/executor:/app/data/executor:Z
    environment:
      - TZ=Asia/Jakarta
      - REDIS_URL=redis://nafaz-redis:6380/0
      - LOCAL_EXCHANGE=indodax
      # "all" is a scanner discovery setting, not a valid CCXT exchange id.
      - GLOBAL_EXCHANGE=okx
      # Executor mode follows config.json mode (MOCK/LIVE).
      # Set EXECUTOR_MOCK_MODE=true only as an explicit emergency override.
      - EXECUTOR_MOCK_MODE=${EXECUTOR_MOCK_MODE:-}
      # Best-effort audit persistence. Unset = disabled, trading unaffected.
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - SUPABASE_OUTBOX_PATH=${SUPABASE_OUTBOX_PATH:-/app/data/executor/supabase-outbox.sqlite3}
      # Read-only exposure reconciliation. Empty = executor defaults
      # (interval 300s, rel tolerance 0.5%, abs tolerance 1e-8).
      - EXPOSURE_RECONCILIATION_INTERVAL_SECONDS=${EXPOSURE_RECONCILIATION_INTERVAL_SECONDS:-}
      - EXPOSURE_RECONCILIATION_REL_TOLERANCE=${EXPOSURE_RECONCILIATION_REL_TOLERANCE:-}
      - EXPOSURE_RECONCILIATION_ABS_TOLERANCE=${EXPOSURE_RECONCILIATION_ABS_TOLERANCE:-}
    depends_on:
      - redis

