name: Test

on:
  pull_request:
    branches: [main, "audit/**", "architecture/**"]
  push:
    branches: [main, "feat/**", "fix/**", "audit/**", "architecture/**"]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run executor tests
        run: pytest -q

  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python static checks
        run: python -m pip install --upgrade pip && pip install ruff mypy
      - name: Compile executor and tests
        run: python -m compileall -q executor tests
      - name: Ruff lint V2 control and admission modules
        run: |
          ruff check --select E4,E7,E9,F \
            executor/main.py executor/engine_entry_submission.py \
            executor/v2_control_runtime.py executor/v2_config.py \
            executor/v2_config_runtime.py executor/v2_config_schema_helpers.py \
            executor/v2_operator_control.py executor/v2_operator_models.py \
            executor/v2_operator_repository_common.py executor/v2_operator_repository_start.py \
            executor/v2_operator_repository_stop.py executor/v2_telegram_bot.py \
            tests/test_v2_config.py \
            tests/test_v2_entry_admission.py tests/test_v2_telegram_control.py
      - name: Ruff format check for executor entrypoint and public control facade
        run: ruff format --check executor/main.py executor/v2_operator_control.py
      - name: Mypy V2 control modules
        run: |
          mypy --ignore-missing-imports --follow-imports=skip \
            --allow-untyped-defs --allow-any-generics \
            executor/v2_operator_models.py executor/v2_operator_repository_common.py \
            executor/v2_operator_repository_start.py executor/v2_operator_repository_stop.py \
            executor/v2_operator_control.py executor/v2_control_runtime.py

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Go tests
        run: go test ./...
      - name: Run Go race tests
        run: go test -race ./...
      - name: Run Go vet
        run: go vet ./...

  supabase-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: nafaz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nafaz_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Create Supabase roles
        run: |
          psql -h localhost -U postgres -d nafaz_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE anon NOLOGIN;" \
            -c "CREATE ROLE authenticated NOLOGIN;" \
            -c "CREATE ROLE service_role NOLOGIN BYPASSRLS;"
      - name: Apply all versioned migrations in order
        run: |
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -h localhost -U postgres -d nafaz_test -v ON_ERROR_STOP=1 -f "$migration"
            if [[ "$migration" == "supabase/migrations/20261107000100_create_nafaz_core_schema.sql" ]]; then
              # Seed a pre-existing baseline row before the additive idempotency migration.
              psql -h localhost -U postgres -d nafaz_test -v ON_ERROR_STOP=1 -c "
                INSERT INTO public.scanner_opportunities (
                  scan_id, pair_key, local_exchange, global_exchange,
                  local_symbol, global_symbol, quote_asset, eligibility_status,
                  observed_at, payload
                ) VALUES (
                  'legacy-before-idempotency', 'indodax:legacy_idr',
                  'indodax', 'okx', 'legacy_idr', 'LEGACY/USDT:USDT',
                  'IDR', 'EXCLUDED', now(), '{}'::jsonb
                );"
            fi
          done
      - name: Verify every migration is idempotent
        run: |
          for migration in supabase/migrations/*.sql; do
            echo "Replaying $migration"
            psql -h localhost -U postgres -d nafaz_test -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify RLS, grants and updated_at triggers
        run: |
          psql -h localhost -U postgres -d nafaz_test -v ON_ERROR_STOP=1 \
            -f supabase/tests/schema_smoke.sql
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies for PostgreSQL repository integration
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run V2 execution repository PostgreSQL integration test
        env:
          NAFAZ_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/nafaz_test
        run: pytest -q tests/test_v2_execution_repository_postgres.py

  docker-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build scanner image
        run: docker build -f Dockerfile -t nafaz-scanner:ci .
      - name: Build executor image
        run: docker build -f Dockerfile.executor -t nafaz-executor:ci .
