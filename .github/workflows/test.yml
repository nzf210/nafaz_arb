name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**", "fix/**"]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run executor tests
        run: pytest -q

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Go tests
        run: go test ./...
      - name: Run Go race tests
        run: go test -race ./...
      - name: Run Go vet
        run: go vet ./...

  supabase-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: nafaz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nafaz_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Check VPS migration runner shell syntax
        run: bash -n scripts/vps-migrate.sh
      - name: Create Supabase roles
        run: |
          psql -h localhost -U postgres -d nafaz_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE anon NOLOGIN;" \
            -c "CREATE ROLE authenticated NOLOGIN;" \
            -c "CREATE ROLE service_role NOLOGIN BYPASSRLS;"
      - name: Apply all versioned migrations in order
        run: |
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -h localhost -U postgres -d nafaz_test -v ON_ERROR_STOP=1 -f "$migration"
            if [[ "$migration" == "supabase/migrations/20261107000100_create_nafaz_core_schema.sql" ]]; then
              # Seed a pre-existing baseline row before the additive idempotency migration.
              psql -h localhost -U postgres -d nafaz_test -v ON_ERROR_STOP=1 -c "
                INSERT INTO public.scanner_opportunities (
                  scan_id, pair_key, local_exchange, global_exchange,
                  local_symbol, global_symbol, quote_asset, eligibility_status,
                  observed_at, payload
                ) VALUES (
                  'legacy-before-idempotency', 'indodax:legacy_idr',
                  'indodax', 'okx', 'legacy_idr', 'LEGACY/USDT:USDT',
                  'IDR', 'EXCLUDED', now(), '{}'::jsonb
                );"
            fi
          done
      - name: Verify every migration is idempotent
        run: |
          for migration in supabase/migrations/*.sql; do
            echo "Replaying $migration"
            psql -h localhost -U postgres -d nafaz_test -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify RLS, grants and updated_at triggers
        run: |
          psql -h localhost -U postgres -d nafaz_test -v ON_ERROR_STOP=1 \
            -f supabase/tests/schema_smoke.sql
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python integration-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Exercise real PostgreSQL multi-process submit disconnect
        timeout-minutes: 3
        env:
          TEST_POSTGRES_DSN: postgresql://postgres@localhost:5432/nafaz_test
        run: pytest -q tests/test_postgres_submit_fencing_integration.py
      - name: Exercise durable Executor V3 session aggregate repository
        timeout-minutes: 3
        env:
          TEST_POSTGRES_DSN: postgresql://postgres@localhost:5432/nafaz_test
        run: pytest -q tests/test_execution_repository_integration.py
      - name: Exercise Executor V3 ownership leases and risk controls
        timeout-minutes: 3
        env:
          TEST_POSTGRES_DSN: postgresql://postgres@localhost:5432/nafaz_test
        run: pytest -q tests/test_ownership_risk_control_integration.py
      - name: Exercise Executor V3 session coordinator and mutation intent gateway
        timeout-minutes: 5
        env:
          TEST_POSTGRES_DSN: postgresql://postgres@localhost:5432/nafaz_test
        run: |
          pytest -q tests/test_session_coordinator.py
          pytest -q tests/test_order_intent_service.py
          pytest -q tests/test_session_entry_intent_coordinator.py
          pytest -q tests/test_mutation_gateway_v3_intents.py
          pytest -q tests/test_mutation_gateway_v3_cancel.py
          pytest -q tests/test_mutation_intent_recovery.py
      - name: Exercise Executor V3 durable fill lifecycle
        timeout-minutes: 5
        env:
          TEST_POSTGRES_DSN: postgresql://postgres@localhost:5432/nafaz_test
        run: pytest -q tests/test_execution_fill_service.py
      - name: Exercise Executor V3 durable hedge obligations and reservations
        timeout-minutes: 5
        env:
          TEST_POSTGRES_DSN: postgresql://postgres@localhost:5432/nafaz_test
        run: pytest -q tests/test_execution_hedge_obligations.py
      - name: Exercise Executor V3 liquidity evaluator and durable hedge scheduler
        timeout-minutes: 5
        env:
          TEST_POSTGRES_DSN: postgresql://postgres@localhost:5432/nafaz_test
        run: |
          pytest -q tests/test_hedge_liquidity_evaluator.py
          pytest -q tests/test_hedge_scheduler_integration.py

  docker-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build scanner image
        run: docker build -f Dockerfile -t nafaz-scanner:ci .
      - name: Build executor image
        run: docker build -f Dockerfile.executor -t nafaz-executor:ci .

  vps-migration-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated Docker PostgreSQL
        run: |
          docker run --detach --name nafaz-migration-pg \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_DB=nafaz \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            pgvector/pgvector:pg15
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec nafaz-migration-pg pg_isready -U postgres -d nafaz >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          [[ "$ready" == true ]]
          docker exec nafaz-migration-pg psql -U postgres -d nafaz -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE anon NOLOGIN;" \
            -c "CREATE ROLE authenticated NOLOGIN;" \
            -c "CREATE ROLE service_role NOLOGIN BYPASSRLS;"
      - name: Block accidental PostgreSQL client calls on the host
        run: |
          guard_dir="$(mktemp -d)"
          for tool in psql pg_isready pg_dump pg_restore; do
            cat > "$guard_dir/$tool" <<EOF
          #!/bin/sh
          echo "ERROR: $tool must run inside the selected PostgreSQL container, not on the host." >&2
          exit 97
          EOF
            chmod 700 "$guard_dir/$tool"
          done
          echo "$guard_dir" >> "$GITHUB_PATH"
      - name: Dry-run a fresh database without host PostgreSQL tools
        env:
          NAFAZ_ENV_FILE: /dev/null
          NAFAZ_PG_CONTAINER: nafaz-migration-pg
          PGDATABASE: nafaz
          PGUSER: postgres
          MIGRATION_BACKUP_DIR: /tmp/nafaz-migration-runner-backups
        run: |
          output="$(bash scripts/vps-migrate.sh --dry-run 2>&1)" || {
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"
          grep -q "fresh installation" <<< "$output"
          grep -q "DRY-RUN:" <<< "$output"
          ledger="$(docker exec nafaz-migration-pg psql -U postgres -d nafaz -Atqc \
            "select to_regclass('public.nafaz_schema_migrations') is not null")"
          [[ "$ledger" == "f" ]]
      - name: Apply migrations through Docker and verify ledger
        env:
          NAFAZ_ENV_FILE: /dev/null
          NAFAZ_PG_CONTAINER: nafaz-migration-pg
          PGDATABASE: nafaz
          PGUSER: postgres
          MIGRATION_BACKUP_DIR: /tmp/nafaz-migration-runner-backups
        run: |
          bash scripts/vps-migrate.sh --apply
          expected="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)"
          actual="$(docker exec nafaz-migration-pg psql -U postgres -d nafaz -Atqc \
            "select count(*) from public.nafaz_schema_migrations")"
          [[ "$actual" == "$expected" ]]
          backup="$(find /tmp/nafaz-migration-runner-backups -maxdepth 1 -type f -name '*.dump' -print -quit)"
          [[ -n "$backup" && -s "$backup" ]]
          [[ "$(stat -c '%a' "$backup")" == "600" ]]
          [[ "$(stat -c '%a' /tmp/nafaz-migration-runner-backups)" == "700" ]]
          echo "Applied $actual migrations; verified backup: $backup"
      - name: Verify idempotent rerun and restore the generated backup
        env:
          NAFAZ_ENV_FILE: /dev/null
          NAFAZ_PG_CONTAINER: nafaz-migration-pg
          PGDATABASE: nafaz
          PGUSER: postgres
          MIGRATION_BACKUP_DIR: /tmp/nafaz-migration-runner-backups
        run: |
          output="$(bash scripts/vps-migrate.sh --dry-run 2>&1)"
          printf '%s\n' "$output"
          grep -q "already up to date" <<< "$output"
          backup="$(find /tmp/nafaz-migration-runner-backups -maxdepth 1 -type f -name '*.dump' -print -quit)"
          docker exec nafaz-migration-pg createdb -U postgres nafaz_restore_test
          docker exec -i nafaz-migration-pg pg_restore -U postgres -d nafaz_restore_test \
            --no-owner --no-acl < "$backup"
          # The runner deliberately snapshots the database BEFORE creating
          # the migration ledger or applying schema changes. A restore of this
          # archive must therefore reproduce the pristine pre-migration state.
          restored_ledger="$(docker exec nafaz-migration-pg psql -U postgres -d nafaz_restore_test -Atqc \
            "select to_regclass('public.nafaz_schema_migrations') is not null")"
          restored_tables="$(docker exec nafaz-migration-pg psql -U postgres -d nafaz_restore_test -Atqc \
            "select count(*) from pg_tables where schemaname='public'")"
          [[ "$restored_ledger" == "f" ]]
          [[ "$restored_tables" == "0" ]]
      - name: Refuse an untracked existing schema without changing it
        env:
          NAFAZ_ENV_FILE: /dev/null
          NAFAZ_PG_CONTAINER: nafaz-migration-pg
          PGUSER: postgres
        run: |
          docker exec nafaz-migration-pg createdb -U postgres nafaz_legacy_test
          docker exec nafaz-migration-pg psql -U postgres -d nafaz_legacy_test -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE public.existing_application_data (id integer primary key);"
          if PGDATABASE=nafaz_legacy_test bash scripts/vps-migrate.sh --dry-run > /tmp/nafaz-legacy-guard.log 2>&1; then
            cat /tmp/nafaz-legacy-guard.log
            echo "Expected the runner to reject an existing schema without a migration ledger." >&2
            exit 1
          fi
          grep -q "Existing public tables found" /tmp/nafaz-legacy-guard.log
          count="$(docker exec nafaz-migration-pg psql -U postgres -d nafaz_legacy_test -Atqc \
            "select count(*) from information_schema.tables where table_schema='public'")"
          [[ "$count" == "1" ]]
      - name: Remove isolated Docker PostgreSQL
        if: always()
        run: docker rm --force nafaz-migration-pg || true

