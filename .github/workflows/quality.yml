name: Quality Gate

on:
  pull_request:
    branches: [v2]
  push:
    branches: [v2]

permissions:
  contents: read

jobs:
  file-length:
    name: Enforce 500-line source limit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Identify changed source files
        id: changed
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}" --depth=1
            git diff --name-only "$BASE"...HEAD > changed-files.txt
          else
            git diff-tree --no-commit-id --name-only -r HEAD > changed-files.txt
          fi
          cat changed-files.txt
      - name: Enforce maximum 500 lines
        run: |
          mapfile -t files < changed-files.txt
          python scripts/check_file_length.py "${files[@]}"

  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    if: ${{ secrets.SONAR_TOKEN != '' && vars.SONAR_HOST_URL != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run Go tests with coverage
        run: go test ./... -coverprofile=coverage.out
      - name: Run Python tests with coverage
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov
          pytest -q --cov=executor --cov-report=xml:coverage.xml
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
